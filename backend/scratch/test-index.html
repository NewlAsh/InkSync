<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - Echo Server</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #1e1e1e; color: #fff; }
        textarea { width: 100%; height: 200px; font-family: monospace; font-size: 16px; padding: 10px; background: #2d2d2d; color: #fff; border: 1px solid #555; }
    </style>
</head>
<body>

    <h2>Real-Time Sync Sandbox</h2>
    <textarea id="editor" placeholder="Start typing here..."></textarea>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // Connects automatically to the origin server (localhost:3000)
        const socket = io(); 
        const editor = document.getElementById('editor');

        // 1. Capture keystrokes and emit them to the server
        editor.addEventListener('input', (e) => {
            const content = e.target.value;
            socket.emit('typing', content);
        });

        // 2. Listen for incoming changes from other tabs
        socket.on('update-editor', (incomingContent) => {
            editor.value = incomingContent;
        });
    </script>
</body>
</html>
